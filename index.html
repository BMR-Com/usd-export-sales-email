<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>BMR-Com · US Cotton Export Sales</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--ink:#1a2333;--muted:#667085;--line:#e6e8ec;--bg:#f6f7f9;--card:#fff;--brand:#13315c;--accent:#c2410c;--up:#166534;--dn:#b91c1c;--upbg:#dcfce7;--dnbg:#fee2e2;--neu:#f1f2f4}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.bar{background:var(--brand);color:#fff;padding:.85rem 1.4rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem}
.bar h1{font-size:1.05rem;font-weight:600}
.bar .sub{font-size:11.5px;opacity:.75}
.wrap{max-width:1400px;margin:0 auto;padding:1rem 1.2rem 2rem}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:.9rem}
.pill,.seg button{padding:5px 13px;border-radius:99px;border:1px solid #cfd4dc;background:#fff;font-size:12.5px;cursor:pointer;color:var(--ink)}
.pill.on,.seg button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.head{display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap;margin-bottom:.7rem}
.head h2{font-size:1.25rem;font-weight:650}
.head .meta{font-size:12px;color:var(--muted)}
.tag{display:inline-block;border-radius:5px;padding:4px 10px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.tag.strong{background:var(--upbg);color:var(--up)}.tag.weak{background:var(--dnbg);color:var(--dn)}.tag.on{background:var(--neu);color:#444}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(175px,100%),1fr));gap:.6rem;margin-bottom:1rem}
.k{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:.65rem .8rem}
.k>span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:3px}
.k b{font-size:1.3rem;font-weight:650;font-variant-numeric:tabular-nums}
.k i{font-style:normal;font-size:11px;color:var(--muted);margin-left:3px}
.k small{display:block;font-size:11.5px;color:var(--muted);margin-top:3px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1rem;margin-bottom:1rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem}
@media(max-width:950px){.grid,.two{grid-template-columns:1fr}}
.grid>*,.two>*{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1rem 1.1rem;margin-bottom:1rem}
.grid>.card,.two>.card{margin-bottom:0}
.sec{display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--brand);margin:0 0 .6rem;border-left:3px solid var(--brand);padding-left:.45rem}
.ctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center;text-transform:none;letter-spacing:0;font-weight:400}
.ctl select{padding:4px 8px;border:1px solid #cfd4dc;border-radius:6px;font-size:12px;background:#fff}
.seg{display:inline-flex;gap:4px}.seg button{padding:3px 10px;font-size:11.5px}
.brief .h{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--brand);margin-top:.55rem}
.brief p{font-size:13.5px;line-height:1.6;margin-bottom:.3rem}
.chartbox{position:relative;height:340px}.chartbox.s{height:300px}
.scroll{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
table.t th{background:var(--brand);color:#fff;font-weight:500;font-size:11px;padding:7px 9px;text-align:right;white-space:nowrap}
table.t th.l,table.t td.l{text-align:left}
table.t th.sort{cursor:pointer;user-select:none}table.t th.sort:after{content:' ↕';opacity:.5}
table.t td{padding:6px 9px;border-bottom:1px solid #eef0f3;text-align:right;white-space:nowrap}
table.t tbody tr:nth-child(even) td{background:#fafbfc}
table.t tbody tr:hover td{background:#eef3fb}
table.t tr.grp td{background:#eef1f6!important;font-weight:700;color:var(--brand);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
table.t td.b{font-weight:650}
table.t th.gh{text-align:center;border-left:1px solid rgba(255,255,255,.25);background:#0e2547}
table.t tr.oth td{font-style:italic;background:#f3f4f6!important;border-top:1.5px solid #d6dae1}
.up{color:var(--up)}.dn{color:var(--dn)}.mut{color:#9aa1ad}
.chip{display:inline-block;border-radius:4px;padding:1px 7px;font-size:10.5px;font-weight:700;text-transform:uppercase}
.chip.more{background:var(--upbg);color:var(--up)}.chip.less{background:var(--dnbg);color:var(--dn)}.chip.norm{background:var(--neu);color:#555}
.barcell{position:relative;min-width:90px}.barcell .bf{position:absolute;right:0;top:22%;bottom:22%;background:rgba(194,65,12,.14);border-radius:2px}.barcell span{position:relative}
.note{font-size:11px;color:var(--muted);margin-top:.45rem;line-height:1.5}
.heat td.m{width:46px;text-align:center;font-size:11.5px}
.heat td.now{outline:2px solid var(--accent);outline-offset:-2px}
footer{font-size:11px;color:var(--muted);text-align:center;padding:1.2rem}
.spinner{padding:2rem;text-align:center;color:var(--muted)}
@media(max-width:600px){.wrap{padding:.8rem 1rem 1.5rem}.card{padding:.8rem}.chartbox{height:280px}}
</style>
</head>
<body>
<div class="bar"><h1>BMR-Com · US Cotton Export Sales</h1><div class="sub" id="gen">USDA FAS weekly export sales vs USDA WASDE</div></div>
<div class="wrap">
  <div class="pills" id="pills" style="display:none"></div>
  <div id="body"><div class="spinner">Loading…</div></div>
</div>
<footer>BMR-Com · independent commodity research · Data: USDA FAS Export Sales Reporting (upland + Pima), USDA WASDE · Not investment advice.</footer>
<script>
(function(){
  var D=null,B=null,cur=null,charts={},sortKey='commit',sortDir=-1,seasMetric='commit',seasMode='abs';
  var $=function(id){return document.getElementById(id);};
  var md=function(t){return String(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');};
  function n(v,d){if(v==null||isNaN(v))return '–';return (+v).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});}
  function q(v){if(v==null||isNaN(v))return '–';return (+v).toLocaleString(undefined,{minimumFractionDigits:Math.abs(v)>=100?0:1,maximumFractionDigits:Math.abs(v)>=100?0:1});}
  // cell shading vs last year: green above, red below, deeper with the size of the gap (full at ±50%)
  function shade(a,b){if(a==null||b==null||isNaN(a)||isNaN(b)||(Math.abs(b)<1e-9&&Math.abs(a)<1e-9))return '';var r=Math.abs(b)<1e-9?1:(a-b)/Math.abs(b);if(Math.abs(r)<0.02)return '';
    var t=Math.min(1,Math.abs(r)/0.5),al=(0.12+0.5*t).toFixed(2);return ' style="background:'+(r>0?'rgba(34,139,84,'+al+')':'rgba(214,40,40,'+al+')')+(t>0.75?';color:#fff':'')+'"';}
  function pc(v,d){return v==null||isNaN(v)?'–':(v*100).toFixed(d==null?0:d)+'%';}
  function rel(a,b){if(a==null||b==null||b===0)return '<span class="mut">–</span>';var r=a/b-1;if(Math.abs(r)<0.005)return '<span class="mut">0%</span>';return '<span class="'+(r>0?'up':'dn')+'">'+(r>0?'+':'')+(r*100).toFixed(0)+'%</span>';}
  function dif(a,b,d){if(a==null||b==null)return '<span class="mut">–</span>';var r=a-b;if(Math.abs(r)<Math.pow(10,-d)/2)return '<span class="mut">0</span>';return '<span class="'+(r>0?'up':'dn')+'">'+(r>0?'+':'')+n(r,d)+'</span>';}
  function kpi(l,v,u,s){return '<div class="k"><span>'+l+'</span><b>'+v+'</b><i>'+(u||'')+'</i><small>'+(s||'')+'</small></div>';}
  var METRICS={commit:'Total commitments',accumulatedExports:'Shipped to date',outstandingSales:'Outstanding sales',currentMYNetSales:'Net sales (weekly)',weeklyExports:'Shipments (weekly)',grossNewSales:'Gross new sales (weekly)',nextMYOutstandingSales:'Next-season outstanding',nextMYNetSales:'Next-season net sales (weekly)'};
  var FLOWS={currentMYNetSales:1,weeklyExports:1,grossNewSales:1,nextMYNetSales:1};

  function scorecard(){
    var S=B.score,flows=S.filter(function(x){return x.type==='flow';}),stocks=S.filter(function(x){return x.type==='stock';});
    var h='<table class="t"><thead><tr><th class="l">'+B.unit+'</th><th>This week</th><th>Last week</th><th>w/w</th><th>4-wk avg</th><th>Same week LY</th><th>vs LY</th><th>5-yr avg</th><th>vs 5-yr</th><th>Season to date</th><th>vs LY</th><th>vs 5-yr</th></tr></thead><tbody>';
    h+='<tr class="grp"><td class="l" colspan="12">Weekly activity</td></tr>';
    flows.forEach(function(x){h+='<tr><td class="l b">'+x.label+'</td><td class="b"'+shade(x.tw,x.ly)+'>'+q(x.tw)+'</td><td>'+q(x.lw)+'</td><td>'+rel(x.tw,x.lw)+'</td><td>'+q(x.avg4)+'</td><td>'+q(x.ly)+'</td><td>'+rel(x.tw,x.ly)+'</td><td>'+q(x.avg5)+'</td><td>'+rel(x.tw,x.avg5)+'</td><td class="b"'+shade(x.ytd,x.ytd_ly)+'>'+q(x.ytd)+'</td><td>'+rel(x.ytd,x.ytd_ly)+'</td><td>'+rel(x.ytd,x.ytd_avg5)+'</td></tr>';});
    h+='<tr class="grp"><td class="l" colspan="12">Book position</td></tr>';
    stocks.forEach(function(x){h+='<tr><td class="l b">'+x.label+'</td><td class="b"'+shade(x.tw,x.ly)+'>'+q(x.tw)+'</td><td>'+q(x.lw)+'</td><td>'+dif(x.tw,x.lw,0)+'</td><td></td><td>'+q(x.ly)+'</td><td>'+rel(x.tw,x.ly)+'</td><td>'+q(x.avg5)+'</td><td>'+rel(x.tw,x.avg5)+'</td><td></td><td></td><td></td></tr>';});
    return h+'</tbody></table><div class="note">This-week and season-to-date cells are shaded green when above the same week last year and red when below (deeper = bigger gap). “Same week LY” and “5-yr avg” are taken at the same week of the marketing year. Season to date sums the weekly figures since August 1; shipped to date and commitments also include sales carried in from earlier seasons.</div>';
  }
  function countryTable(){
    var rows=(B.countries||[]).filter(function(r){return !r.others;}),oth=(B.countries||[]).filter(function(r){return r.others;});
    rows.forEach(function(r){r.yy=r.commit_ly?r.commit/r.commit_ly-1:null;r.vsexp=r.exp_mytd?r.accum/r.exp_mytd-1:null;});
    rows.sort(function(a,b){var x=a[sortKey],y=b[sortKey];if(typeof x==='string')return sortDir*x.localeCompare(y);return sortDir*((x==null?-1e9:x)-(y==null?-1e9:y));});
    var mx=Math.max.apply(null,rows.map(function(r){return r.commit;}))||1;
    var th=function(k,l,c){return '<th class="sort '+(c||'')+'" data-k="'+k+'">'+l+(sortKey===k?(sortDir>0?' ▲':' ▼'):'')+'</th>';};
    var h='<table class="t ctab"><thead><tr><th class="l" rowspan="2" style="vertical-align:bottom">'+'Destination'+'</th><th colspan="3" class="gh">Net sales</th><th colspan="3" class="gh">Shipments</th><th colspan="4" class="gh">Shipped to date</th><th colspan="2" class="gh">Outstanding</th><th colspan="3" class="gh">Total commitments</th><th colspan="2" class="gh">Expected season (5-yr US share)</th><th rowspan="2" style="vertical-align:bottom">Next season</th></tr><tr>'+
      th('net','This wk')+th('net_lw','Last wk')+th('net_ly','Same wk LY')+th('ship','This wk')+th('ship_lw','Last wk')+th('ship_ly','Same wk LY')+
      th('accum','Actual')+th('accum_ly','LY')+th('exp_mytd','Expected')+th('vsexp','vs exp.')+th('outst','Now')+th('outst_ly','LY')+th('commit','Now')+th('commit_ly','LY')+th('yy','vs LY')+th('exp_season','Shipments')+th('us_share5','US share')+'</tr></thead><tbody>';
    var line=function(r,cls){var sg=function(v){return v<0?'<span class="dn">'+q(v)+'</span>':q(v);};
      return '<tr'+(cls?' class="'+cls+'"':'')+'><td class="l b">'+r.c+'</td><td class="b"'+shade(r.net,r.net_ly)+'>'+sg(r.net)+'</td><td class="mut">'+q(r.net_lw)+'</td><td class="mut">'+q(r.net_ly)+'</td><td class="b"'+shade(r.ship,r.ship_ly)+'>'+q(r.ship)+'</td><td class="mut">'+q(r.ship_lw)+'</td><td class="mut">'+q(r.ship_ly)+'</td>'+
      '<td class="b"'+shade(r.accum,r.accum_ly)+'>'+q(r.accum)+'</td><td class="mut">'+q(r.accum_ly)+'</td><td>'+q(r.exp_mytd)+'</td><td>'+(r.exp_mytd?rel(r.accum,r.exp_mytd):'<span class="mut">–</span>')+'</td><td'+shade(r.outst,r.outst_ly)+'>'+q(r.outst)+'</td><td class="mut">'+q(r.outst_ly)+'</td>'+
      '<td class="b"'+shade(r.commit,r.commit_ly)+'>'+q(r.commit)+'</td><td class="mut">'+q(r.commit_ly)+'</td><td>'+rel(r.commit,r.commit_ly)+'</td><td>'+q(r.exp_season)+'</td><td>'+pc(r.us_share5)+'</td><td>'+q(r.next)+'</td></tr>';};
    rows.forEach(function(r){h+=line(r);});
    oth.forEach(function(r){h+=line(r,'oth');});
    return h+'</tbody></table><div class="note">'+B.unit+'. Top 12 markets by commitments; the rest are grouped as Others. Expected season = USDA\'s import forecast for the country × the US share of its imports over the last 5 seasons, on the running-bale basis. Expected to date = that volume × the share of its season the country has usually received by this week. Cells for this season are shaded green when above the same week last year and red when below — deeper colour for a bigger gap. Click a column heading to sort.</div>';
  }
  function render(){
    B=D.commodities.filter(function(c){return c.name===cur;})[0]; if(!B)return;
    $('pills').style.display=D.commodities.length>1?'':'none';
    $('pills').innerHTML=D.commodities.map(function(c){return '<button class="pill'+(c.name===cur?' on':'')+'" data-c="'+c.name+'">'+c.name+'</button>';}).join('');
    var tl={strong:['strong','Running ahead of USDA'],weak:['weak','Running behind USDA'],'on track':['on','On track with USDA']}[B.tilt],wf=B.w_fmt!=null?B.w_fmt:2;
    var S={};B.score.forEach(function(x){S[x.k]=x;});
    var h='<div class="head"><div><h2>US '+B.name.toLowerCase()+' exports · '+B.my+'</h2><div class="meta">Week ending '+B.week+' (week '+B.wk+' of the marketing year) · USDA forecast from the '+B.report+' WASDE · upland + Pima</div></div><span class="tag '+tl[0]+'">'+tl[1]+'</span></div>';
    h+='<div class="kpis">'+
      kpi('Net sales this week',q(S.currentMYNetSales.tw),B.unit,rel(S.currentMYNetSales.tw,S.currentMYNetSales.lw)+' w/w · '+rel(S.currentMYNetSales.tw,S.currentMYNetSales.avg5)+' vs 5-yr')+
      kpi('Shipments this week',q(S.weeklyExports.tw),B.unit,rel(S.weeklyExports.tw,S.weeklyExports.lw)+' w/w · need '+q(B.need_ship)+'/wk for USDA')+
      kpi('Total commitments',q(B.commit),B.unit,pc(B.pace)+' of USDA · norm '+pc(B.pace_norm)+' · '+rel(B.commit,B.ly_commit)+' y/y')+
      kpi('Shipped to date',q(B.shipped),B.unit,pc(B.ship_pct)+' of USDA · norm '+pc(B.ship_norm))+
      kpi('USDA forecast',n(B.target,wf),B.w_unit,'≈ '+q(B.target_esr)+' '+B.unit+' (×'+(B.ratio||0).toFixed(3)+') · '+(B.target_prev!=null&&B.target_prev!==B.target?((B.target-B.target_prev)>0?'+':'')+n(B.target-B.target_prev,wf)+' vs prior report':'unchanged vs prior report'))+
      kpi('Pace implies',B.implied==null?'–':n(B.implied,wf),B.w_unit,B.implied==null?'':rel(B.implied,B.target)+' vs USDA')+'</div>';
    h+='<div class="card"><div class="sec">Week on week and season to date</div><div class="scroll">'+scorecard()+'</div></div>';
    h+='<div class="grid"><div class="card brief"><div class="sec">Brief</div>'+B.brief.map(function(b){return '<div class="h">'+b.h+'</div><p>'+md(b.t)+'</p>';}).join('')+'</div>'+
      '<div class="card"><div class="sec"><span>Seasonal comparison</span><span class="ctl"><select id="seasMetric" aria-label="Metric">'+Object.keys(METRICS).map(function(k){return '<option value="'+k+'"'+(k===seasMetric?' selected':'')+'>'+METRICS[k]+'</option>';}).join('')+
      '</select><span class="seg" id="seasMode"><button data-m="abs" class="'+(seasMode==='abs'?'on':'')+'">Volume</button><button data-m="pct" class="'+(seasMode==='pct'?'on':'')+'">% of season</button></span></span></div><div class="chartbox"><canvas id="seas"></canvas></div>'+
      '<div class="note">Hover for values; click a season in the legend to hide or show it. “% of season” shows commitments as a share of each season\'s final shipments (this season: USDA\'s forecast).</div>'+
      '<div class="sec" style="margin-top:1rem">This season, week by week</div><div class="chartbox s"><canvas id="weekly"></canvas></div></div></div>';
    var dd=(B.dest||[]).filter(function(d){return d.c!=='Unknown destinations';});
    if(dd.length){
      h+='<div class="grid"><div class="card"><div class="sec">Top destinations — commitments vs last year and 5-yr average ('+B.unit+')</div><div class="chartbox"><canvas id="dest"></canvas></div></div>';
      h+='<div class="card"><div class="sec">Destinations vs USDA import forecasts</div><div class="scroll"><table class="t"><thead><tr><th class="l">Destination</th><th>Import forecast</th><th>Usually booked by now</th><th>US share 5-yr</th><th>10-yr</th><th>Pace-implied</th><th class="l">Read</th></tr></thead><tbody>'+
      dd.filter(function(d){return d.imports!=null;}).map(function(d){var r=d.vs_usual==null||isNaN(d.vs_usual)?'<span class="mut">too early</span>':(d.vs_usual>0.15?'<span class="chip more">more US</span>':d.vs_usual<-0.15?'<span class="chip less">less US</span>':'<span class="chip norm">normal</span>');
        return '<tr><td class="l b">'+d.c+'</td><td>'+n(d.imports,2)+'</td><td>'+pc(d.norm_pct)+'</td><td>'+pc(d.us_share5)+'</td><td>'+pc(d.us_share10)+'</td><td class="b">'+pc(d.implied_share)+'</td><td class="l">'+r+'</td></tr>';}).join('')+
      '</tbody></table></div><div class="note">Import forecasts in million 480-lb bales (USDA). US share = US shipments to the country ÷ its imports in past seasons. Pace-implied projects this season\'s sales at the country\'s usual seasonal pace, once it has usually booked a quarter of its purchases.</div></div></div>';
    }
    h+='<div class="card"><div class="sec">By destination — top 12 markets ('+B.unit+')</div><div class="scroll" id="ctab">'+countryTable()+'</div></div>';
    var Sp=B.supply;
    if(Sp&&Sp.exporters&&Sp.exporters.length){
      h+='<div class="two"><div class="card"><div class="sec">Main competitors (m 480-lb bales)</div><div class="scroll"><table class="t"><thead><tr><th class="l">Exporter</th><th>Beg. stocks</th><th>Crop</th><th>Exportable surplus</th><th>vs '+Sp.pmy+'</th><th>Exports</th><th>vs '+Sp.pmy+'</th></tr></thead><tbody>'+
        Sp.exporters.map(function(x){var d=x.surplus-x.surplus_ly;return '<tr'+(x.active?'':' style="opacity:.55"')+'><td class="l b">'+x.r+(x.active?'':' <span class="chip norm">not competing</span>')+'</td><td>'+n(x.bs,2)+'</td><td>'+n(x.prod,2)+'</td><td class="b">'+n(x.surplus,2)+'</td><td class="'+(d<0?'up':'dn')+'">'+(d>0?'+':'')+n(d,2)+'</td><td>'+n(x.exp,2)+'</td><td>'+(x.exp!=null&&x.exp_ly!=null?(x.exp-x.exp_ly>0?'+':'')+n(x.exp-x.exp_ly,2):'–')+'</td></tr>';}).join('')+
        '</tbody></table></div><div class="note">Exportable surplus = beginning stocks + crop − domestic use. Green = less competition for US cotton. India competes only when its supply is about 1.5× its own use or more.</div></div>';
      h+='<div class="card"><div class="sec">Major importers — own supply vs use (m 480-lb bales)</div><div class="scroll"><table class="t"><thead><tr><th class="l">Importer</th><th>Supply</th><th>Use</th><th>Supply − use vs '+Sp.pmy+'</th><th>Imports</th><th>vs '+Sp.pmy+'</th></tr></thead><tbody>'+
        Sp.importers.map(function(x){return '<tr><td class="l b">'+x.r+'</td><td>'+n(x.supply,2)+'</td><td>'+n(x.use,2)+'</td><td class="'+(x.gap<0?'up':'dn')+'">'+(x.gap>0?'+':'')+n(x.gap,2)+'</td><td class="b">'+n(x.imp,2)+'</td><td>'+(x.imp!=null&&x.imp_ly!=null?(x.imp-x.imp_ly>0?'+':'')+n(x.imp-x.imp_ly,2):'–')+'</td></tr>';}).join('')+
        '</tbody></table></div><div class="note">Supply = beginning stocks + crop. Green = tighter own supply, more import need.'+(Sp.us_share&&Sp.us_share_ly?' USDA has the US at '+pc(Sp.us_share)+' of world exports vs '+pc(Sp.us_share_ly)+' last season.':'')+'</div></div></div>';
    }
    if(B.seas&&B.seas.length){
      var mNow=new Date(B.week+'T00:00:00').getMonth(),names=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      h+='<div class="card"><div class="sec">Shipment calendar — % of each destination\'s season shipped by month (last 5 seasons)</div><div class="scroll"><table class="t heat"><thead><tr><th class="l">Destination</th>'+B.months.map(function(m){return '<th>'+m+'</th>';}).join('')+'<th>Usually shipped by now</th><th>Shipped of commitments</th><th>Outstanding ('+B.unit+')</th></tr></thead><tbody>'+
        B.seas.map(function(x){return '<tr><td class="l b">'+x.c+'</td>'+x.share.map(function(v,i){var a=Math.min(1,v/0.18);return '<td class="m'+(B.months[i]===names[mNow]?' now':'')+'" style="background:'+heat(a)+';color:'+(a>0.6?'#fff':'#222')+'" title="'+x.c+' · '+B.months[i]+': '+(v*100).toFixed(1)+'% of season">'+(v>=0.005?(v*100).toFixed(0):'')+'</td>';}).join('')+
        '<td>'+pc(x.norm_shipped)+'</td><td>'+pc(x.shipped_of_commit)+'</td><td>'+q(x.outstanding)+'</td></tr>';}).join('')+'</tbody></table></div><div class="note">Outlined column = current month. Hover a cell for the exact share.</div></div>';
    }
    $('body').innerHTML=h;
    drawSeas(); drawWeekly(); if(dd.length) drawDest(dd);
  }
  var HSTOPS=[[255,247,214],[199,233,180],[65,182,196],[34,94,168],[8,29,88]];
  function heat(a){var x=a*(HSTOPS.length-1),i=Math.min(HSTOPS.length-2,Math.floor(x)),f=x-i,c=HSTOPS[i].map(function(v,k){return Math.round(v+(HSTOPS[i+1][k]-v)*f);});return 'rgb('+c.join(',')+')';}
  function kill(id){if(charts[id]){charts[id].destroy();delete charts[id];}}
  var GREYS=['#2a9d8f','#e9c46a','#8e7cc3','#4a90d9','#7a8899'];
  function drawSeas(){
    kill('seas'); var ds=[],keys=Object.keys(B.series),cy=keys[0],i=0;
    if(seasMode==='pct'){
      Object.keys(B.curve.hist).forEach(function(k){ds.push({label:k,data:B.curve.hist[k].map(function(p){return {x:p[0],y:p[1]*100};}),borderColor:GREYS[i%5],backgroundColor:GREYS[i++%5],borderWidth:2,pointRadius:0,pointHoverRadius:4,tension:.25});});
      ds.push({label:B.my+' (vs USDA)',data:B.curve.cur.map(function(p){return {x:p[0],y:p[1]*100};}),borderColor:'#d62828',backgroundColor:'#d62828',borderWidth:3.5,pointRadius:3,tension:.25});
    } else {
      keys.slice(1).reverse().forEach(function(k){ds.push({label:k,data:(B.series[k][seasMetric]||[]).map(function(p){return {x:p[0],y:p[1]};}),borderColor:GREYS[i%5],backgroundColor:GREYS[i++%5],borderWidth:2,pointRadius:0,pointHoverRadius:4,tension:.25});});
      ds.push({label:cy,data:(B.series[cy][seasMetric]||[]).map(function(p){return {x:p[0],y:p[1]};}),borderColor:'#d62828',backgroundColor:'#d62828',borderWidth:3.5,pointRadius:3,tension:.25});
    }
    charts.seas=new Chart($('seas'),{type:'line',data:{datasets:ds},options:{responsive:true,maintainAspectRatio:false,animation:{duration:250},interaction:{mode:'x',intersect:false},
      plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11}}},tooltip:{itemSort:function(a,b){return b.parsed.y-a.parsed.y;},callbacks:{title:function(c){return 'Week '+c[0].parsed.x;},label:function(c){return ' '+c.dataset.label+': '+(seasMode==='pct'?c.parsed.y.toFixed(0)+'%':q(c.parsed.y));}}}},
      scales:{x:{type:'linear',min:1,max:52,title:{display:true,text:'Week of marketing year (Aug 1 = week 1)'},ticks:{stepSize:4}},y:{beginAtZero:seasMode==='pct'||!FLOWS[seasMetric],title:{display:true,text:seasMode==='pct'?'% of season':METRICS[seasMetric]+', '+B.unit},ticks:{callback:function(v){return seasMode==='pct'?v+'%':v;}}}}}});
  }
  function drawWeekly(){
    kill('weekly'); var cy=Object.keys(B.series)[0],ns=B.series[cy].currentMYNetSales,sh=B.series[cy].weeklyExports,hk=Object.keys(B.series).slice(1),lim=Math.max(ns.length+6,12);
    var avg=function(m){var o={};hk.forEach(function(k){(B.series[k][m]||[]).forEach(function(p){(o[p[0]]=o[p[0]]||[]).push(p[1]);});});return Object.keys(o).map(Number).sort(function(a,b){return a-b;}).filter(function(w){return w<=lim;}).map(function(w){var a=o[w];return {x:w,y:a.reduce(function(s,v){return s+v;},0)/a.length};});};
    charts.weekly=new Chart($('weekly'),{data:{datasets:[
      {type:'bar',label:'Net sales',data:ns.map(function(p){return {x:p[0],y:p[1]};}),backgroundColor:'#2a9d8f',borderRadius:3,barPercentage:.9,categoryPercentage:.8},
      {type:'bar',label:'Shipments',data:sh.map(function(p){return {x:p[0],y:p[1]};}),backgroundColor:'rgba(194,65,12,.75)',borderRadius:3,barPercentage:.9,categoryPercentage:.8},
      {type:'line',label:'Net sales, 5-yr avg',data:avg('currentMYNetSales'),borderColor:'#1d6b62',borderDash:[5,4],borderWidth:1.5,pointRadius:0,tension:.25},
      {type:'line',label:'Shipments, 5-yr avg',data:avg('weeklyExports'),borderColor:'#c2410c',borderDash:[5,4],borderWidth:1.5,pointRadius:0,tension:.25}]},
      options:{responsive:true,maintainAspectRatio:false,animation:{duration:250},interaction:{mode:'x',intersect:false},plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11}}},tooltip:{callbacks:{title:function(c){return 'Week '+c[0].parsed.x;},label:function(c){return ' '+c.dataset.label+': '+q(c.parsed.y);}}}},
      scales:{x:{type:'linear',offset:true,min:0,max:lim+1,ticks:{stepSize:1,callback:function(v){return (v>0&&v<=lim)?v:'';}},title:{display:true,text:'Week of marketing year'}},y:{title:{display:true,text:B.unit}}}}});
  }
  function drawDest(dd){
    kill('dest'); var top=dd.slice().sort(function(a,b){return b.commit-a.commit;}).slice(0,10);
    charts.dest=new Chart($('dest'),{type:'bar',data:{labels:top.map(function(d){return d.c;}),datasets:[
      {label:B.my,data:top.map(function(d){return d.commit;}),backgroundColor:'#d62828',borderRadius:3},
      {label:'Same week last year',data:top.map(function(d){return d.ly;}),backgroundColor:'#4a90d9',borderRadius:3},
      {label:'5-yr average',data:top.map(function(d){return d.avg5;}),backgroundColor:'#e9c46a',borderRadius:3}]},
      options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,animation:{duration:250},interaction:{mode:'y',intersect:false},plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11}}},tooltip:{callbacks:{label:function(c){return ' '+c.dataset.label+': '+q(c.parsed.x);}}}},
      scales:{x:{title:{display:true,text:'Commitments, '+B.unit}}}}});
  }
  document.addEventListener('click',function(e){
    var p=e.target.closest&&e.target.closest('.pill');if(p){cur=p.getAttribute('data-c');render();return;}
    var m=e.target.closest&&e.target.closest('#seasMode button');if(m){seasMode=m.getAttribute('data-m');[].forEach.call(document.querySelectorAll('#seasMode button'),function(b){b.classList.toggle('on',b===m);});drawSeas();return;}
    var th=e.target.closest&&e.target.closest('th.sort');if(th){var k=th.getAttribute('data-k');sortDir=(sortKey===k)?-sortDir:(k==='c'?1:-1);sortKey=k;$('ctab').innerHTML=countryTable();}
  });
  document.addEventListener('change',function(e){if(e.target.id==='seasMetric'){seasMetric=e.target.value;seasMode='abs';[].forEach.call(document.querySelectorAll('#seasMode button'),function(b){b.classList.toggle('on',b.getAttribute('data-m')==='abs');});drawSeas();}});
  fetch('data/brief.json?t='+Date.now()).then(function(r){return r.json();}).then(function(d){
    D=d;$('gen').textContent='Updated '+d.generated+' · USDA FAS export sales vs USDA WASDE';cur=d.commodities[0].name;render();
  }).catch(function(){$('body').innerHTML='<div class="spinner">Brief not available yet.</div>';});
})();
</script>
</body>
