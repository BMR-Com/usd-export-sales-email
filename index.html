<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>BMR-Com · US Cotton Export Sales</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--ink:#1a2333;--muted:#667085;--line:#e6e8ec;--bg:#f6f7f9;--card:#fff;--brand:#13315c;--up:#166534;--dn:#b91c1c;--upbg:#dcfce7;--dnbg:#fee2e2;--neu:#f1f2f4}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.bar{background:var(--brand);color:#fff;padding:.85rem 1.4rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem}
.bar h1{font-size:1.05rem;font-weight:600;letter-spacing:.01em}
.bar .sub{font-size:11.5px;opacity:.75}
.wrap{max-width:1400px;margin:0 auto;padding:1rem 1.2rem 2rem}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:.9rem}
.pill{padding:5px 13px;border-radius:99px;border:1px solid #cfd4dc;background:#fff;font-size:12.5px;cursor:pointer}
.pill.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.head{display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap;margin-bottom:.7rem}
.head h2{font-size:1.25rem;font-weight:650}
.head .meta{font-size:12px;color:var(--muted)}
.tag{display:inline-block;border-radius:5px;padding:4px 10px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.tag.strong{background:var(--upbg);color:var(--up)}.tag.weak{background:var(--dnbg);color:var(--dn)}.tag.on{background:var(--neu);color:#444}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr));gap:.6rem;margin-bottom:.9rem}
.k{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:.65rem .8rem}
.k span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:3px}
.k b{font-size:1.25rem;font-weight:650;font-variant-numeric:tabular-nums}
.k small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:1rem;margin-bottom:1rem}
@media(max-width:950px){.grid{grid-template-columns:1fr}}
.grid>*,.two>*{min-width:0}
@media(max-width:600px){.wrap{padding:.8rem 1rem 1.5rem}.card{padding:.8rem}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1rem 1.1rem}
.sec{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--brand);margin:0 0 .55rem;border-left:3px solid var(--brand);padding-left:.45rem}
.brief .h{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--brand);margin-top:.5rem}
.brief p{font-size:13.5px;line-height:1.6;margin-bottom:.35rem}
.chartbox{position:relative;height:330px}
.scroll{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
table.t th{background:var(--brand);color:#fff;font-weight:500;font-size:11px;padding:6px 8px;text-align:right;white-space:nowrap}
table.t th.l,table.t td.l{text-align:left}
table.t td{padding:5px 8px;border-bottom:1px solid #eef0f3;text-align:right;white-space:nowrap}
table.t tbody tr:nth-child(even) td{background:#fafbfc}
.up{color:var(--up)}.dn{color:var(--dn)}.mut{color:#9aa1ad}
.chip{display:inline-block;border-radius:4px;padding:1px 7px;font-size:10.5px;font-weight:700;text-transform:uppercase}
.chip.more{background:var(--upbg);color:var(--up)}.chip.less{background:var(--dnbg);color:var(--dn)}.chip.norm{background:var(--neu);color:#555}
.note{font-size:11px;color:var(--muted);margin-top:.4rem;line-height:1.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem}
@media(max-width:950px){.two{grid-template-columns:1fr}}
.heat td.m{width:46px;text-align:center;font-size:11.5px}
.heat td.now{outline:2px solid var(--brand);outline-offset:-2px}
footer{font-size:11px;color:var(--muted);text-align:center;padding:1.2rem}
.spinner{padding:2rem;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="bar"><h1>BMR-Com · US Cotton Export Sales</h1><div class="sub" id="gen">USDA FAS weekly export sales vs USDA WASDE</div></div>
<div class="wrap">
  <div class="pills" id="pills"></div>
  <div id="body"><div class="spinner">Loading…</div></div>
</div>
<footer>BMR-Com · independent commodity research · Data: USDA FAS Export Sales Reporting, USDA WASDE · Not investment advice.</footer>
<script>
(function(){
  var D=null, cur=null, chart=null;
  var $=function(id){return document.getElementById(id);};
  var md=function(t){return String(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');};
  function n(v,d){if(v==null||isNaN(v))return '–';return (+v).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});}
  function dp(v){return v==null?2:(Math.abs(v)>=100?0:Math.abs(v)>=10?1:2);}
  function pc(v,d){return v==null||isNaN(v)?'–':(v*100).toFixed(d==null?0:d)+'%';}
  function sg(v){if(v==null||isNaN(v))return '–';var c=v>0?'up':v<0?'dn':'mut';return '<span class="'+c+'">'+(v>0?'+':'')+(v*100).toFixed(0)+'%</span>';}
  function kpi(l,v,s){return '<div class="k"><span>'+l+'</span><b>'+v+'</b><small>'+(s||'')+'</small></div>';}
  function render(){
    var B=D.commodities.filter(function(c){return c.name===cur;})[0]; if(!B)return;
    $('pills').style.display=D.commodities.length>1?'':'none';
    $('pills').innerHTML=D.commodities.map(function(c){return '<button class="pill'+(c.name===cur?' on':'')+'" data-c="'+c.name+'">'+c.name+'</button>';}).join('');
    var tl={strong:['strong','Running ahead of USDA'],weak:['weak','Running behind USDA'],'on track':['on','On track with USDA']}[B.tilt];
    var wf=B.w_fmt!=null?B.w_fmt:2;
    var h='<div class="head"><div><h2>'+B.name+' · '+B.my+'</h2><div class="meta">Export sales week ending '+B.week+' (week '+B.wk+' of the marketing year) · USDA forecast from the '+B.report+' WASDE</div></div><span class="tag '+tl[0]+'">'+tl[1]+'</span></div>';
    h+='<div class="kpis">'+
      kpi('Commitments',n(B.commit,dp(B.commit))+' <small style="display:inline">'+B.unit+'</small>',pc(B.pace)+' of USDA · norm '+pc(B.pace_norm)+(B.ly_commit?' · '+((B.commit/B.ly_commit-1)>=0?'+':'')+((B.commit/B.ly_commit-1)*100).toFixed(0)+'% y/y':''))+
      kpi('Shipped',n(B.shipped,dp(B.shipped)),pc(B.ship_pct)+' of USDA · norm '+pc(B.ship_norm))+
      kpi('USDA forecast',n(B.target,wf)+' <small style="display:inline">'+B.w_unit+'</small>',B.target_prev!=null&&B.target_prev!==B.target?((B.target-B.target_prev)>0?'+':'')+n(B.target-B.target_prev,wf)+' vs prior report':'unchanged vs prior report')+
      kpi('Pace implies',B.implied==null?'–':n(B.implied,wf)+' <small style="display:inline">'+B.w_unit+'</small>',B.implied==null?'':sg(B.implied/B.target-1)+' vs USDA')+
      kpi('Shipments needed / wk',n(B.need_ship,3),'last 4 wks avg '+n(B.ship4,3)+' · '+B.weeks_left+' wks left')+
      kpi('Net sales this week',n(B.net,3),'4-wk avg '+n(B.net4,3)+' · 5-yr avg '+n(B.net4_5y,3))+'</div>';
    h+='<div class="grid"><div class="card brief"><div class="sec">Brief</div>'+B.brief.map(function(b){return '<div class="h">'+b.h+'</div><p>'+md(b.t)+'</p>';}).join('')+'</div>'+
       '<div class="card"><div class="sec">Commitments as % of the season\'s final shipments</div><div class="chartbox"><canvas id="pace"></canvas></div><div class="note">This season is shown against USDA\'s forecast (export-sales basis); past seasons against their final shipments.</div></div></div>';
    // destinations
    var dd=B.dest||[];
    if(dd.length){
      h+='<div class="card" style="margin-bottom:1rem"><div class="sec">Destinations — commitments vs import forecasts</div><div class="scroll"><table class="t"><thead><tr><th class="l">Destination</th><th>Commitments</th><th>Share</th><th>Same week LY</th><th>5-yr avg</th><th>Usually booked by now</th><th>Import forecast</th><th>US share 5-yr</th><th>US share 10-yr</th><th>Pace-implied share</th><th class="l">Read</th></tr></thead><tbody>'+
      dd.map(function(d){var r=d.vs_usual==null||isNaN(d.vs_usual)?'':(d.vs_usual>0.15?'<span class="chip more">more US</span>':d.vs_usual<-0.15?'<span class="chip less">less US</span>':'<span class="chip norm">normal</span>');
        return '<tr><td class="l">'+d.c+'</td><td>'+n(d.commit,3)+'</td><td>'+pc(d.share_now)+'</td><td>'+n(d.ly,3)+'</td><td>'+n(d.avg5,3)+'</td><td>'+pc(d.norm_pct)+'</td><td>'+(d.imports!=null?n(d.imports,2):'<span class="mut">–</span>')+'</td><td>'+pc(d.us_share5)+'</td><td>'+pc(d.us_share10)+'</td><td>'+pc(d.implied_share)+'</td><td class="l">'+r+'</td></tr>';}).join('')+
      '</tbody></table></div><div class="note">Commitments in '+B.unit+'. Import forecasts are USDA\'s for each country ('+(B.name==='Cotton'?'million 480-lb bales':'million metric tons')+'). US share = US shipments to the country ÷ its total imports in past seasons. Pace-implied share projects this season\'s sales to the country at its usual seasonal pace; shown once the country has usually booked a quarter of its purchases.</div></div>';
    }
    // supply
    var S=B.supply;
    if(S&&S.exporters&&S.exporters.length){
      var u=B.name==='Cotton'?'m 480-lb bales':'MMT';
      h+='<div class="two"><div class="card"><div class="sec">Competing exporters ('+u+')</div><div class="scroll"><table class="t"><thead><tr><th class="l">Exporter</th><th>Beg. stocks</th><th>Crop</th><th>Exportable surplus</th><th>vs '+S.pmy+'</th><th>Exports</th><th>vs '+S.pmy+'</th></tr></thead><tbody>'+
        S.exporters.map(function(x){var d=x.surplus-x.surplus_ly;return '<tr><td class="l">'+x.r+'</td><td>'+n(x.bs,2)+'</td><td>'+n(x.prod,2)+'</td><td>'+n(x.surplus,2)+'</td><td class="'+(d<0?'up':'dn')+'">'+(d>0?'+':'')+n(d,2)+'</td><td>'+n(x.exp,2)+'</td><td>'+(x.exp!=null&&x.exp_ly!=null?(x.exp-x.exp_ly>0?'+':'')+n(x.exp-x.exp_ly,2):'–')+'</td></tr>';}).join('')+
        '</tbody></table></div><div class="note">Exportable surplus = beginning stocks + crop − domestic use. Green = less competition for US exports.</div></div>';
      h+='<div class="card"><div class="sec">Major importers — own supply vs use ('+u+')</div><div class="scroll"><table class="t"><thead><tr><th class="l">Importer</th><th>Supply</th><th>Use</th><th>Supply − use vs '+S.pmy+'</th><th>Imports</th><th>vs '+S.pmy+'</th></tr></thead><tbody>'+
        S.importers.map(function(x){return '<tr><td class="l">'+x.r+'</td><td>'+n(x.supply,2)+'</td><td>'+n(x.use,2)+'</td><td class="'+(x.gap<0?'up':'dn')+'">'+(x.gap>0?'+':'')+n(x.gap,2)+'</td><td>'+n(x.imp,2)+'</td><td>'+(x.imp!=null&&x.imp_ly!=null?(x.imp-x.imp_ly>0?'+':'')+n(x.imp-x.imp_ly,2):'–')+'</td></tr>';}).join('')+
        '</tbody></table></div><div class="note">Supply = beginning stocks + crop. Green = tighter own supply, more import need.'+(S.us_share&&S.us_share_ly?' USDA has the US at '+pc(S.us_share)+' of world exports vs '+pc(S.us_share_ly)+' last season.':'')+'</div></div></div>';
    }
    // seasonality heatmap
    if(B.seas&&B.seas.length){
      var mNow=new Date(B.week+'T00:00:00').getMonth(), names=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      h+='<div class="card"><div class="sec">Shipment calendar — share of each destination\'s season shipped by month (last 5 seasons)</div><div class="scroll"><table class="t heat"><thead><tr><th class="l">Destination</th>'+B.months.map(function(m){return '<th>'+m+'</th>';}).join('')+'<th>Usually shipped by now</th><th>Shipped of commitments</th><th>Outstanding</th></tr></thead><tbody>'+
        B.seas.map(function(x){return '<tr><td class="l">'+x.c+'</td>'+x.share.map(function(v,i){var a=Math.min(1,v/0.25);return '<td class="m'+(B.months[i]===names[mNow]?' now':'')+'" style="background:rgba(19,49,92,'+(a*0.75).toFixed(2)+');color:'+(a>0.55?'#fff':'#333')+'">'+(v>=0.005?(v*100).toFixed(0):'')+'</td>';}).join('')+
        '<td>'+pc(x.norm_shipped)+'</td><td>'+pc(x.shipped_of_commit)+'</td><td>'+n(x.outstanding,3)+'</td></tr>';}).join('')+'</tbody></table></div><div class="note">Percent of each destination\'s season shipments made in that month; outlined column is the current month.</div></div>';
    }
    $('body').innerHTML=h;
    // chart
    if(chart){chart.destroy();chart=null;}
    var cols=['#c7cdd6','#b4bcc8','#9ea8b7','#8692a5','#6d7a90'], ds=[], i=0;
    Object.keys(B.curve.hist).forEach(function(k){ds.push({label:k,data:B.curve.hist[k].map(function(p){return {x:p[0],y:p[1]*100};}),borderColor:cols[i++%cols.length],borderWidth:1.5,pointRadius:0,tension:.2});});
    ds.push({label:B.my+' (vs USDA)',data:B.curve.cur.map(function(p){return {x:p[0],y:p[1]*100};}),borderColor:'#c2410c',borderWidth:3,pointRadius:2,tension:.2});
    chart=new Chart($('pace'),{type:'line',data:{datasets:ds},options:{responsive:true,maintainAspectRatio:false,animation:false,interaction:{mode:'nearest',intersect:false},
      plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11}}},tooltip:{callbacks:{label:function(c){return c.dataset.label+': '+c.parsed.y.toFixed(0)+'% (wk '+c.parsed.x+')';}}}},
      scales:{x:{type:'linear',min:1,max:52,title:{display:true,text:'Week of marketing year'},ticks:{stepSize:4}},y:{min:0,suggestedMax:110,ticks:{callback:function(v){return v+'%';}}}}}});
  }
  document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('.pill');if(b){cur=b.getAttribute('data-c');render();try{localStorage.setItem('esr_tab',cur);}catch(x){}}});
  fetch('data/brief.json?t='+Date.now()).then(function(r){return r.json();}).then(function(d){
    D=d; $('gen').textContent='Updated '+d.generated+' · USDA FAS export sales vs USDA WASDE';
    var saved=null; try{saved=localStorage.getItem('esr_tab');}catch(x){}
    cur=d.commodities.some(function(c){return c.name===saved;})?saved:d.commodities[0].name; render();
  }).catch(function(){ $('body').innerHTML='<div class="spinner">Brief not available yet.</div>'; });
})();
</script>
</body>
</html>
