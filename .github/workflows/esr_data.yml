name: Export sales data + brief

# USDA releases export sales Thursdays 8:30 AM ET (Friday or later in holiday weeks).
on:
  schedule:
    - cron: '50 12 * * 4'   # Thu 8:50 AM EDT / 7:50 AM EST
    - cron: '50 13 * * 4'   # Thu 9:50 AM EDT / 8:50 AM EST
    - cron: '0 15 * * 5'    # Fri catch-up (holiday weeks)
    - cron: '0 15 * * 1'    # Mon catch-up (picks up the latest WASDE too)
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests -q
      - name: Upland cotton history
        run: python scripts/fetch_cotton_history.py
      - name: Other commodities
        run: python scripts/fetch_esr.py
      - name: Build brief
        run: |
          if [ -f scripts/build_brief.py ]; then python scripts/build_brief.py; fi
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cotton_history_1404.csv cotton_data.js data/
          if git diff --staged --quiet; then echo "No changes"; else git commit -m "data: export sales $(date -u +%Y-%m-%d) [skip ci]" && git pull --rebase -q && git push; fi
