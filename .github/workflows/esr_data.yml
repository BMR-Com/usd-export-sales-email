name: Export sales data + brief

# USDA releases export sales Thursdays 8:30 AM ET (Friday or later in holiday weeks).
on:
  schedule:
    # USDA releases Thursdays 8:30 AM ET (12:30 UTC in summer time, 13:30 UTC in winter); holiday weeks move to Friday.
    # Poll every 10 minutes through the release window; each run stops at once if the new week is already archived.
    # Off-peak minutes (not :00/:30) — GitHub delays or drops scheduled runs at busy minutes.
    # Window runs to 21:57 UTC so a late-firing schedule still lands the same day.
    - cron: '37,47,57 12 * * 4,5'
    - cron: '7-57/10 13-21 * * 4,5'
    - cron: '23 15 * * 1'    # Monday catch-up (later releases, new WASDE)
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even if the latest week is already archived'
        required: false
        default: 'true'

concurrency:
  group: esr-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests -q
      - name: Is a new report due?
        id: due
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force || (github.event.schedule == '23 15 * * 1' && 'true' || 'false') }}
        run: python scripts/need_update.py
      - name: Upland cotton history
        if: steps.due.outputs.state == 'update'
        env:
          FAS_API_KEY: ${{ secrets.FAS_API_KEY }}
        run: python scripts/fetch_cotton_history.py
      - name: Pima cotton
        if: steps.due.outputs.state == 'update'
        env:
          FAS_API_KEY: ${{ secrets.FAS_API_KEY }}
        run: python scripts/fetch_esr.py
      - name: Build brief
        if: steps.due.outputs.state == 'update'
        run: |
          if [ -f scripts/build_brief.py ]; then python scripts/build_brief.py; fi
      - name: Commit
        if: steps.due.outputs.state == 'update'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cotton_history_1404.csv cotton_data.js data/
          if git diff --staged --quiet; then echo "No changes"; else git commit -m "data: export sales $(date -u +%Y-%m-%d) [skip ci]" && git pull --rebase -q && git push; fi
